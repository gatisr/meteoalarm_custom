name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate-with-hassfest:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7"
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Oldest supported HA (hacs.json) and the latest.
          - python: '3.13'
            phcc: '0.13.316'
          - python: '3.14'
            phcc: ''
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements_test.txt
        if [ -n "${{ matrix.phcc }}" ]; then pip install pytest-homeassistant-custom-component==${{ matrix.phcc }}; fi
    - name: Lint
      run: |
        pip install ruff
        ruff check .
    - name: Run tests
      run: |
        pytest tests/
  card:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: '24'
    - name: Install, type-check and build the Lovelace card
      working-directory: card
      run: |
        npm ci
        npm run build
    - name: Test the Lovelace card
      working-directory: card
      run: npm test
    - name: Fail if the committed bundle is stale
      run: git diff --exit-code custom_components/meteoalarm_custom/frontend/meteoalarm-card.js
